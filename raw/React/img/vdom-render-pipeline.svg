<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 570" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <defs>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b7cfa"/>
    </marker>
    <marker id="arrD" viewBox="0 0 10 10" refX="5" refY="9" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L5,10 L10,0 z" fill="#5b7cfa"/>
    </marker>
  </defs>

  <!-- 行1 用户层 -->
  <text x="20" y="62" font-size="14" fill="#94a3b8">你写的</text>
  <text x="20" y="82" font-size="14" fill="#94a3b8">代码</text>
  <rect x="150" y="20" width="820" height="100" rx="10" fill="#eef4ff" stroke="#5b7cfa" stroke-width="1.5"/>
  <text x="170" y="42" font-size="13" fill="#3b5bdb" font-weight="bold">JSX 语法糖 —— 声明式描述 UI（开发时写的代码）</text>
  <text x="175" y="70" font-size="14" font-family="Consolas,'Courier New',monospace" fill="#1e293b">&lt;div className="card"&gt;</text>
  <text x="175" y="94" font-size="14" font-family="Consolas,'Courier New',monospace" fill="#1e293b">&#160;&#160;&lt;h1&gt;Hello React&lt;/h1&gt;</text>
  <text x="175" y="114" font-size="14" font-family="Consolas,'Courier New',monospace" fill="#1e293b">&lt;/div&gt;</text>

  <!-- 行1 -> 行2 箭头 -->
  <line x1="560" y1="120" x2="560" y2="170" stroke="#5b7cfa" stroke-width="2" marker-end="url(#arrD)"/>

  <!-- 行2 React 运行时 -->
  <text x="20" y="215" font-size="14" fill="#94a3b8">React</text>
  <text x="20" y="235" font-size="14" fill="#94a3b8">运行时</text>

  <!-- 阶段1 -->
  <rect x="100" y="185" width="175" height="165" rx="10" fill="#ffffff" stroke="#5b7cfa" stroke-width="1.5"/>
  <rect x="100" y="185" width="175" height="34" rx="10" fill="#5b7cfa"/>
  <rect x="100" y="205" width="175" height="14" fill="#5b7cfa"/>
  <text x="187" y="207" font-size="14" fill="#ffffff" font-weight="bold" text-anchor="middle">① createElement</text>
  <text x="187" y="245" font-size="12" fill="#334155" text-anchor="middle">Babel 把 JSX 编译为对</text>
  <text x="187" y="264" font-size="12" fill="#334155" text-anchor="middle">createElement(type,</text>
  <text x="187" y="283" font-size="12" fill="#334155" text-anchor="middle">props, ...children)</text>
  <text x="187" y="302" font-size="12" fill="#334155" text-anchor="middle">的调用</text>

  <!-- 阶段2 -->
  <rect x="335" y="185" width="175" height="165" rx="10" fill="#ffffff" stroke="#5b7cfa" stroke-width="1.5"/>
  <rect x="335" y="185" width="175" height="34" rx="10" fill="#4263eb"/>
  <rect x="335" y="205" width="175" height="14" fill="#4263eb"/>
  <text x="422" y="207" font-size="14" fill="#ffffff" font-weight="bold" text-anchor="middle">② React Element</text>
  <text x="422" y="245" font-size="12" fill="#334155" text-anchor="middle">虚拟 DOM 节点：普通</text>
  <text x="422" y="264" font-size="12" fill="#334155" text-anchor="middle">JS 对象，如</text>
  <text x="422" y="283" font-size="12" font-family="Consolas,monospace" fill="#3b5bdb">{ type, props,</text>
  <text x="422" y="302" font-size="12" font-family="Consolas,monospace" fill="#3b5bdb">&#160;&#160;key, ref }</text>

  <!-- 阶段3 -->
  <rect x="570" y="185" width="175" height="165" rx="10" fill="#ffffff" stroke="#5b7cfa" stroke-width="1.5"/>
  <rect x="570" y="185" width="175" height="34" rx="10" fill="#3b5bdb"/>
  <rect x="570" y="205" width="175" height="14" fill="#3b5bdb"/>
  <text x="657" y="207" font-size="14" fill="#ffffff" font-weight="bold" text-anchor="middle">③ 协调 Reconciler</text>
  <text x="657" y="245" font-size="12" fill="#334155" text-anchor="middle">diff 新旧 vnode 树，</text>
  <text x="657" y="264" font-size="12" fill="#334155" text-anchor="middle">构建 Fiber 树，</text>
  <text x="657" y="283" font-size="12" fill="#334155" text-anchor="middle">计算"最小变更"</text>
  <text x="657" y="302" font-size="12" fill="#334155" text-anchor="middle">（只读、纯计算）</text>

  <!-- 阶段4 -->
  <rect x="805" y="185" width="175" height="165" rx="10" fill="#ffffff" stroke="#5b7cfa" stroke-width="1.5"/>
  <rect x="805" y="185" width="175" height="34" rx="10" fill="#2f539e"/>
  <rect x="805" y="205" width="175" height="14" fill="#2f539e"/>
  <text x="892" y="207" font-size="14" fill="#ffffff" font-weight="bold" text-anchor="middle">④ 提交 commit</text>
  <text x="892" y="245" font-size="12" fill="#334155" text-anchor="middle">react-dom 依据变更</text>
  <text x="892" y="264" font-size="12" fill="#334155" text-anchor="middle">标记，执行真实的</text>
  <text x="892" y="283" font-size="12" fill="#334155" text-anchor="middle">DOM 增 / 删 / 改</text>
  <text x="892" y="302" font-size="12" fill="#334155" text-anchor="middle">（副作用，不可中断）</text>

  <!-- 阶段间箭头 -->
  <line x1="275" y1="267" x2="335" y2="267" stroke="#5b7cfa" stroke-width="2" marker-end="url(#arrR)"/>
  <line x1="510" y1="267" x2="570" y2="267" stroke="#5b7cfa" stroke-width="2" marker-end="url(#arrR)"/>
  <line x1="745" y1="267" x2="805" y2="267" stroke="#5b7cfa" stroke-width="2" marker-end="url(#arrR)"/>

  <!-- 产出说明 -->
  <text x="187" y="372" font-size="12" fill="#94a3b8" text-anchor="middle">产出：React Element</text>
  <text x="422" y="372" font-size="12" fill="#94a3b8" text-anchor="middle">产出：描述 UI 的对象树</text>
  <text x="657" y="372" font-size="12" fill="#94a3b8" text-anchor="middle">产出：变更标记(副作用)</text>
  <text x="892" y="372" font-size="12" fill="#94a3b8" text-anchor="middle">产出：对 DOM 的写入</text>

  <!-- 阶段4 -> 行3 箭头 -->
  <line x1="892" y1="350" x2="892" y2="420" stroke="#5b7cfa" stroke-width="2" marker-end="url(#arrD)"/>

  <!-- 行3 浏览器 -->
  <text x="20" y="465" font-size="14" fill="#94a3b8">浏览器</text>
  <text x="20" y="485" font-size="14" fill="#94a3b8">渲染</text>
  <rect x="150" y="420" width="820" height="100" rx="10" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/>
  <text x="170" y="444" font-size="13" fill="#15803d" font-weight="bold">真实 DOM —— 浏览器渲染引擎实际操作的节点树</text>
  <text x="175" y="474" font-size="14" font-family="Consolas,'Courier New',monospace" fill="#1e293b">&lt;div class="card"&gt;</text>
  <text x="175" y="498" font-size="14" font-family="Consolas,'Courier New',monospace" fill="#1e293b">&#160;&#160;&lt;h1&gt;Hello React&lt;/h1&gt;</text>
  <text x="175" y="514" font-size="12" fill="#64748b">由 commit 阶段一次性创建 / 更新；更新时只改动 diff 出的节点，不整棵重建</text>
</svg>
