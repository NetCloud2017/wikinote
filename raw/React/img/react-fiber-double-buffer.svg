<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <title>React Fiber 双缓冲机制</title>
  <defs>
    <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#c0392b"/>
    </marker>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2f6f9f"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="600" fill="#ffffff"/>
  <text x="450" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#1a1a1a">双缓冲（Double Buffering）：current 与 workInProgress</text>
  <text x="450" y="58" text-anchor="middle" font-size="13" fill="#666">始终存在两棵 Fiber 树，对应节点通过 alternate 互指；提交后整体切换 current</text>

  <!-- current 树 -->
  <text x="180" y="110" text-anchor="middle" font-size="15" font-weight="bold" fill="#c0392b">current 树（已在屏幕上）</text>
  <g>
    <rect x="130" y="140" width="100" height="36" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/>
    <text x="180" y="163" text-anchor="middle" font-size="13" fill="#7a1f16">App</text>
    <rect x="110" y="250" width="100" height="36" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/>
    <text x="160" y="273" text-anchor="middle" font-size="13" fill="#7a1f16">Header</text>
    <rect x="250" y="250" width="100" height="36" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/>
    <text x="300" y="273" text-anchor="middle" font-size="13" fill="#7a1f16">Nav</text>
  </g>
  <line x1="160" y1="286" x2="160" y2="360" stroke="#c0392b" stroke-width="2"/>
  <line x1="300" y1="286" x2="300" y2="360" stroke="#c0392b" stroke-width="2"/>
  <rect x="110" y="360" width="100" height="36" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/>
  <text x="160" y="383" text-anchor="middle" font-size="13" fill="#7a1f16">div</text>
  <rect x="250" y="360" width="100" height="36" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/>
  <text x="300" y="383" text-anchor="middle" font-size="13" fill="#7a1f16">ul</text>

  <!-- workInProgress 树 -->
  <text x="720" y="110" text-anchor="middle" font-size="15" font-weight="bold" fill="#2f6f9f">workInProgress 树（内存中构建）</text>
  <g>
    <rect x="660" y="140" width="100" height="36" rx="8" fill="#eaf3fb" stroke="#2f6f9f" stroke-width="1.6"/>
    <text x="710" y="163" text-anchor="middle" font-size="13" fill="#1a1a1a">App'</text>
    <rect x="640" y="250" width="100" height="36" rx="8" fill="#eaf3fb" stroke="#2f6f9f" stroke-width="1.6"/>
    <text x="690" y="273" text-anchor="middle" font-size="13" fill="#1a1a1a">Header'</text>
    <rect x="780" y="250" width="100" height="36" rx="8" fill="#eaf3fb" stroke="#2f6f9f" stroke-width="1.6"/>
    <text x="830" y="273" text-anchor="middle" font-size="13" fill="#1a1a1a">Nav'</text>
  </g>
  <line x1="690" y1="286" x2="690" y2="360" stroke="#2f6f9f" stroke-width="2"/>
  <line x1="830" y1="286" x2="830" y2="360" stroke="#2f6f9f" stroke-width="2"/>
  <rect x="640" y="360" width="100" height="36" rx="8" fill="#eaf3fb" stroke="#2f6f9f" stroke-width="1.6"/>
  <text x="690" y="383" text-anchor="middle" font-size="13" fill="#1a1a1a">div'</text>
  <rect x="780" y="360" width="100" height="36" rx="8" fill="#eaf3fb" stroke="#2f6f9f" stroke-width="1.6"/>
  <text x="830" y="383" text-anchor="middle" font-size="13" fill="#1a1a1a">ul'</text>

  <!-- alternate 连线 -->
  <line x1="230" y1="158" x2="660" y2="158" stroke="#7a7a7a" stroke-width="1.6" stroke-dasharray="7 4" marker-end="url(#a2)"/>
  <line x1="210" y1="268" x2="640" y2="268" stroke="#7a7a7a" stroke-width="1.6" stroke-dasharray="7 4" marker-end="url(#a2)"/>
  <line x1="350" y1="268" x2="780" y2="268" stroke="#7a7a7a" stroke-width="1.6" stroke-dasharray="7 4" marker-end="url(#a2)"/>
  <line x1="210" y1="378" x2="640" y2="378" stroke="#7a7a7a" stroke-width="1.6" stroke-dasharray="7 4" marker-end="url(#a2)"/>
  <line x1="350" y1="378" x2="780" y2="378" stroke="#7a7a7a" stroke-width="1.6" stroke-dasharray="7 4" marker-end="url(#a2)"/>

  <!-- alternate 标签 -->
  <text x="445" y="152" text-anchor="middle" font-size="11" fill="#7a7a7a">alternate 互指</text>
  <text x="445" y="262" text-anchor="middle" font-size="11" fill="#7a7a7a">alternate</text>

  <!-- 提交切换 -->
  <g>
    <rect x="40" y="470" width="820" height="88" rx="12" fill="#f6f8fa" stroke="#c8ccd2" stroke-width="1.2"/>
    <text x="450" y="498" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">Commit 之后：current 指针整体切到新树</text>
    <text x="450" y="524" text-anchor="middle" font-size="13" fill="#444">fiberRootNode.current = workInProgress</text>
    <text x="450" y="548" text-anchor="middle" font-size="12.5" fill="#555">好处：更新时复用 alternate 上的旧 fiber 减少重建；在内存里构建完整新树后再一次性提交，页面不会出现“一半新一半旧”的中间态</text>
  </g>

  <text x="450" y="592" text-anchor="middle" font-size="12" fill="#999">示意图：为便于阅读省略了部分节点与指针</text>
</svg>
