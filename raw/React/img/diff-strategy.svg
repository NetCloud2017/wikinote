<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- ===== 场景 A ===== -->
  <rect x="30" y="20" width="940" height="160" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="50" y="46" font-size="14" fill="#0f172a" font-weight="bold">策略一 · 类型不同 → 整棵子树重建</text>

  <rect x="50" y="62" width="250" height="76" rx="8" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="175" y="84" font-size="13" fill="#b91c1c" font-weight="bold" text-anchor="middle">旧 vnode</text>
  <text x="175" y="106" font-size="13" font-family="Consolas,monospace" fill="#1e293b" text-anchor="middle">&lt;div&gt;...&lt;/div&gt;</text>
  <text x="175" y="126" font-size="11" fill="#94a3b8" text-anchor="middle">type = 'div'</text>

  <text x="320" y="100" font-size="24" fill="#64748b" text-anchor="middle">→</text>
  <text x="352" y="110" font-size="12" fill="#64748b" text-anchor="middle">type 不同</text>

  <rect x="470" y="62" width="250" height="76" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="595" y="84" font-size="13" fill="#1d4ed8" font-weight="bold" text-anchor="middle">新 vnode</text>
  <text x="595" y="106" font-size="13" font-family="Consolas,monospace" fill="#1e293b" text-anchor="middle">&lt;span&gt;...&lt;/span&gt;</text>
  <text x="595" y="126" font-size="11" fill="#94a3b8" text-anchor="middle">type = 'span'</text>

  <rect x="760" y="62" width="190" height="76" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="855" y="94" font-size="12.5" fill="#334155" text-anchor="middle">结果：销毁旧 DOM 节点，</text>
  <text x="855" y="113" font-size="12.5" fill="#334155" text-anchor="middle">连同整棵子树一起重建</text>
  <text x="855" y="132" font-size="11" fill="#94a3b8" text-anchor="middle">连带 state 也一并重置</text>

  <!-- ===== 场景 B ===== -->
  <rect x="30" y="195" width="940" height="160" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="50" y="221" font-size="14" fill="#0f172a" font-weight="bold">策略二 · 类型相同 → 复用节点，只更新属性</text>

  <rect x="50" y="237" width="250" height="76" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="175" y="259" font-size="13" fill="#b45309" font-weight="bold" text-anchor="middle">旧 vnode</text>
  <text x="175" y="281" font-size="13" font-family="Consolas,monospace" fill="#1e293b" text-anchor="middle">&lt;div id="a" class="red"/&gt;</text>
  <text x="175" y="301" font-size="11" fill="#94a3b8" text-anchor="middle">type 相同 = 'div'</text>

  <text x="320" y="275" font-size="24" fill="#64748b" text-anchor="middle">→</text>
  <text x="352" y="285" font-size="12" fill="#64748b" text-anchor="middle">type 相同</text>

  <rect x="470" y="237" width="250" height="76" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="595" y="259" font-size="13" fill="#047857" font-weight="bold" text-anchor="middle">新 vnode</text>
  <text x="595" y="281" font-size="13" font-family="Consolas,monospace" fill="#1e293b" text-anchor="middle">&lt;div id="b" class="blue"/&gt;</text>
  <text x="595" y="301" font-size="11" fill="#94a3b8" text-anchor="middle">type 相同 = 'div'</text>

  <rect x="760" y="237" width="190" height="76" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="855" y="262" font-size="12.5" fill="#334155" text-anchor="middle">结果：复用同一个 DOM</text>
  <text x="855" y="281" font-size="12.5" fill="#334155" text-anchor="middle">节点，只更新变化的</text>
  <text x="855" y="300" font-size="12.5" fill="#334155" text-anchor="middle">属性（id、class）</text>

  <!-- ===== 场景 C ===== -->
  <rect x="30" y="370" width="940" height="170" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="50" y="396" font-size="14" fill="#0f172a" font-weight="bold">策略三 · 列表用 key → 复用 / 移动 / 增删</text>

  <rect x="50" y="412" width="250" height="110" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="175" y="432" font-size="13" fill="#475569" font-weight="bold" text-anchor="middle">旧列表</text>
  <text x="175" y="456" font-size="12.5" fill="#334155" text-anchor="middle">[ A(key=a), B(key=b), C(key=c) ]</text>
  <text x="175" y="478" font-size="11" fill="#94a3b8" text-anchor="middle">渲染为三个 &lt;li&gt;</text>

  <text x="322" y="470" font-size="24" fill="#64748b" text-anchor="middle">→</text>
  <text x="352" y="490" font-size="12" fill="#64748b" text-anchor="middle">按 key 对比</text>

  <rect x="470" y="412" width="250" height="110" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="595" y="432" font-size="13" fill="#475569" font-weight="bold" text-anchor="middle">新列表（B 被移到末尾）</text>
  <text x="595" y="456" font-size="12.5" fill="#334155" text-anchor="middle">[ A(key=a), C(key=c), B(key=b) ]</text>
  <text x="595" y="478" font-size="11" fill="#94a3b8" text-anchor="middle">key 相同即复用对应 DOM</text>

  <rect x="760" y="412" width="190" height="110" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="855" y="440" font-size="12.5" fill="#334155" text-anchor="middle">结果：key 相同→复用节点；</text>
  <text x="855" y="459" font-size="12.5" fill="#334155" text-anchor="middle">仅识别"新增 / 删除 / 移动"，</text>
  <text x="855" y="478" font-size="12.5" fill="#334155" text-anchor="middle">不做无谓重建</text>
  <text x="855" y="500" font-size="11" fill="#e11d48" text-anchor="middle">key 应稳定唯一，别用 index</text>

  <!-- 底部提示 -->
  <text x="50" y="552" font-size="12" fill="#94a3b8">基于三条前提假设，React 把 O(n³) 的树比对降到 O(n)，并在同层级比较（不做跨层移动）</text>
</svg>
