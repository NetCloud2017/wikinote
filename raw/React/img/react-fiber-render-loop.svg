<svg xmlns="http://www.w3.org/2000/svg" width="920" height="640" viewBox="0 0 920 640" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <title>React Fiber 渲染流水线与调度</title>
  <defs>
    <marker id="m1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#444"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="920" height="640" fill="#ffffff"/>
  <text x="460" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#1a1a1a">渲染流水线：Render（可中断）→ Commit（不可中断）</text>

  <!-- 触发源 -->
  <g>
    <rect x="330" y="66" width="260" height="40" rx="10" fill="#f4f4f2" stroke="#999" stroke-width="1.3"/>
    <text x="460" y="92" text-anchor="middle" font-size="14" fill="#333">触发：setState / 新 props / 挂载</text>
  </g>
  <line x1="460" y1="106" x2="460" y2="130" stroke="#444" stroke-width="2" marker-end="url(#m1)"/>

  <!-- 调度器 -->
  <g>
    <rect x="300" y="132" width="320" height="46" rx="10" fill="#fff8e6" stroke="#c99a2e" stroke-width="1.4"/>
    <text x="460" y="154" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5c12">调度器（Scheduler）</text>
    <text x="460" y="171" text-anchor="middle" font-size="12" fill="#7a5c12">按 Lanes 优先级排队、决定谁先谁后、可抢占</text>
  </g>
  <line x1="460" y1="178" x2="460" y2="200" stroke="#444" stroke-width="2" marker-end="url(#m1)"/>

  <!-- Render 阶段 -->
  <g>
    <rect x="60" y="202" width="800" height="180" rx="14" fill="#eef6ff" stroke="#2f6f9f" stroke-width="2"/>
    <text x="460" y="228" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a3a55">Render 阶段：可中断、可恢复（Concurrent）</text>
    <text x="460" y="248" text-anchor="middle" font-size="12.5" fill="#444">以 root 为起点做深度优先迭代，为每个 fiber 执行工作，构建 workInProgress 树</text>

    <rect x="120" y="270" width="150" height="46" rx="9" fill="#dbe9fb" stroke="#2f6f9f" stroke-width="1.4"/>
    <text x="195" y="289" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">beginWork</text>
    <text x="195" y="306" text-anchor="middle" font-size="11" fill="#444">算 props/state、创建子 fiber</text>

    <line x1="270" y1="293" x2="330" y2="293" stroke="#2f6f9f" stroke-width="2" marker-end="url(#m1)"/>

    <rect x="332" y="270" width="150" height="46" rx="9" fill="#dbe9fb" stroke="#2f6f9f" stroke-width="1.4"/>
    <text x="407" y="289" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">completeWork</text>
    <text x="407" y="306" text-anchor="middle" font-size="11" fill="#444">无子时完成当前节点、处理兄弟</text>

    <line x1="482" y1="293" x2="520" y2="293" stroke="#2f6f9f" stroke-width="2" marker-end="url(#m1)"/>

    <rect x="522" y="270" width="140" height="46" rx="9" fill="#dbe9fb" stroke="#2f6f9f" stroke-width="1.4"/>
    <text x="592" y="289" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">时间切片</text>
    <text x="592" y="306" text-anchor="middle" font-size="11" fill="#444">每片做完让出主线程</text>

    <rect x="120" y="330" width="700" height="38" rx="8" fill="#fdf3f3" stroke="#c0392b" stroke-width="1.3"/>
    <text x="470" y="354" text-anchor="middle" font-size="12.5" fill="#7a1f16">高优更新来了？暂停当前 render，保存断点，先处理高优 → 之后从断点继续（不重新跑整棵树）</text>
  </g>

  <line x1="460" y1="382" x2="460" y2="408" stroke="#444" stroke-width="2" marker-end="url(#m1)"/>

  <!-- Commit 阶段 -->
  <g>
    <rect x="150" y="410" width="620" height="150" rx="14" fill="#fdf6f0" stroke="#c2620e" stroke-width="2"/>
    <text x="460" y="436" text-anchor="middle" font-size="16" font-weight="bold" fill="#5a3a10">Commit 阶段：不可中断、同步执行</text>
    <text x="460" y="456" text-anchor="middle" font-size="12.5" fill="#444">拿到 render 结果，沿 effects 链表一次性提交，操作真实 DOM</text>

    <rect x="190" y="478" width="120" height="42" rx="9" fill="#fbe8d8" stroke="#c2620e" stroke-width="1.4"/>
    <text x="250" y="503" text-anchor="middle" font-size="12.5" fill="#5a3a10">before mutation</text>
    <text x="250" y="516" text-anchor="middle" font-size="10.5" fill="#777">getSnapshotBeforeUpdate</text>

    <line x1="310" y1="499" x2="365" y2="499" stroke="#c2620e" stroke-width="2" marker-end="url(#m1)"/>

    <rect x="368" y="478" width="120" height="42" rx="9" fill="#fbe8d8" stroke="#c2620e" stroke-width="1.4"/>
    <text x="428" y="503" text-anchor="middle" font-size="12.5" fill="#5a3a10">mutation</text>
    <text x="428" y="516" text-anchor="middle" font-size="10.5" fill="#777">插入/更新/删除 DOM</text>

    <line x1="488" y1="499" x2="543" y2="499" stroke="#c2620e" stroke-width="2" marker-end="url(#m1)"/>

    <rect x="546" y="478" width="120" height="42" rx="9" fill="#fbe8d8" stroke="#c2620e" stroke-width="1.4"/>
    <text x="606" y="503" text-anchor="middle" font-size="12.5" fill="#5a3a10">layout</text>
    <text x="606" y="516" text-anchor="middle" font-size="10.5" fill="#777">useLayoutEffect / 切换 current</text>

    <line x1="460" y1="520" x2="460" y2="560" stroke="#c2620e" stroke-width="2" marker-end="url(#m1)"/>
  </g>

  <!-- Lanes 图例 -->
  <g font-size="12" fill="#444">
    <rect x="60" y="588" width="800" height="42" rx="10" fill="#f4f4f2" stroke="#ccc" stroke-width="1.2"/>
    <text x="80" y="615" font-size="12.5" font-weight="bold" fill="#333">Lanes 优先级（位掩码车道）：</text>
    <text x="250" y="615" fill="#444">SyncLane（同步）</text>
    <text x="380" y="615" fill="#444">DefaultLane（普通更新）</text>
    <text x="530" y="615" fill="#444">TransitionLane（useTransition 过渡）</text>
    <text x="720" y="615" fill="#444">RetryLane（重试）…</text>
  </g>
</svg>
