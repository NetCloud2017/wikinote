<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <!-- ===== 上半：Stack ===== -->
  <rect x="30" y="20" width="940" height="235" rx="12" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
  <text x="50" y="48" font-size="15" fill="#9a3412" font-weight="bold">Stack Reconciler（React 15）· 同步、不可中断</text>

  <!-- 一棵树：根->A->A1 -->
  <line x1="190" y1="100" x2="190" y2="150" stroke="#f97316" stroke-width="2"/>
  <line x1="190" y1="150" x2="120" y2="200" stroke="#f97316" stroke-width="2"/>
  <line x1="190" y1="150" x2="260" y2="200" stroke="#f97316" stroke-width="2"/>
  <line x1="260" y1="200" x2="260" y2="230" stroke="#f97316" stroke-width="2" stroke-dasharray="3,3"/>

  <rect x="155" y="72" width="70" height="28" rx="6" fill="#fb923c" stroke="#ea580c"/>
  <text x="190" y="90" font-size="12.5" fill="#ffffff" font-weight="bold" text-anchor="middle">根 Root</text>
  <rect x="85" y="122" width="70" height="28" rx="6" fill="#fdba74" stroke="#ea580c"/>
  <text x="120" y="140" font-size="12.5" fill="#7c2d12" text-anchor="middle">节点 A</text>
  <rect x="225" y="122" width="70" height="28" rx="6" fill="#fdba74" stroke="#ea580c"/>
  <text x="260" y="140" font-size="12.5" fill="#7c2d12" text-anchor="middle">节点 B</text>
  <rect x="225" y="202" width="70" height="28" rx="6" fill="#fed7aa" stroke="#ea580c"/>
  <text x="260" y="220" font-size="12.5" fill="#7c2d12" text-anchor="middle">B1</text>

  <!-- 贯穿整棵树的同步箭头 -->
  <line x1="330" y1="90" x2="330" y2="230" stroke="#ea580c" stroke-width="4"/>
  <polygon points="330,238 324,228 336,228" fill="#ea580c"/>
  <text x="350" y="105" font-size="12" fill="#9a3412">一次性、自上而下</text>
  <text x="350" y="123" font-size="12" fill="#9a3412">递归遍历整棵树，</text>
  <text x="350" y="141" font-size="12" fill="#9a3412">期间不返回控制权</text>

  <rect x="560" y="72" width="380" height="120" rx="10" fill="#ffffff" stroke="#fdba74" stroke-width="1.5"/>
  <text x="580" y="98" font-size="13" fill="#334155" font-weight="bold">问题：</text>
  <text x="580" y="120" font-size="12.5" fill="#475569">· 一旦开始，整棵组件树的 diff 必须一口气算完</text>
  <text x="580" y="140" font-size="12.5" fill="#475569">· 期间主线程被占用，用户输入、动画无法响应</text>
  <text x="580" y="160" font-size="12.5" fill="#475569">· 应用越大，单次同步渲染耗时越长，越容易卡顿</text>

  <text x="560" y="215" font-size="12" fill="#9a3412">本质：递归调用栈，无法中断 / 恢复 / 丢弃</text>

  <!-- ===== 下半：Fiber ===== -->
  <rect x="30" y="275" width="940" height="265" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="50" y="303" font-size="15" fill="#1e40af" font-weight="bold">Fiber Reconciler（React 16+）· 可中断 + 时间切片</text>

  <!-- 同构树，但按片段高亮 -->
  <line x1="190" y1="360" x2="190" y2="410" stroke="#3b82f6" stroke-width="2"/>
  <line x1="190" y1="410" x2="120" y2="460" stroke="#3b82f6" stroke-width="2"/>
  <line x1="190" y1="410" x2="260" y2="460" stroke="#3b82f6" stroke-width="2"/>
  <line x1="260" y1="460" x2="260" y2="490" stroke="#3b82f6" stroke-width="2" stroke-dasharray="3,3"/>

  <rect x="155" y="332" width="70" height="28" rx="6" fill="#3b82f6" stroke="#2563eb"/>
  <text x="190" y="350" font-size="12.5" fill="#ffffff" font-weight="bold" text-anchor="middle">根</text>
  <rect x="85" y="382" width="70" height="28" rx="6" fill="#93c5fd" stroke="#2563eb"/>
  <text x="120" y="400" font-size="12.5" fill="#1e3a8a" text-anchor="middle">A</text>
  <rect x="225" y="382" width="70" height="28" rx="6" fill="#93c5fd" stroke="#2563eb"/>
  <text x="260" y="400" font-size="12.5" fill="#1e3a8a" text-anchor="middle">B</text>
  <rect x="225" y="462" width="70" height="28" rx="6" fill="#bfdbfe" stroke="#2563eb"/>
  <text x="260" y="480" font-size="12.5" fill="#1e3a8a" text-anchor="middle">B1</text>

  <!-- 分片示意 -->
  <line x1="330" y1="360" x2="330" y2="490" stroke="#3b82f6" stroke-width="4"/>
  <g stroke="#60a5fa" stroke-width="4">
    <line x1="330" y1="360" x2="345" y2="360"/>
    <line x1="330" y1="382" x2="345" y2="382"/>
    <line x1="330" y1="404" x2="345" y2="404"/>
    <line x1="330" y1="426" x2="345" y2="426"/>
    <line x1="330" y1="448" x2="345" y2="448"/>
    <line x1="330" y1="470" x2="345" y2="470"/>
  </g>
  <text x="350" y="380" font-size="12" fill="#1e40af">把整棵树的渲染拆成</text>
  <text x="350" y="398" font-size="12" fill="#1e40af">一个个小"工作单元"</text>
  <text x="350" y="416" font-size="12" fill="#1e40af">（fiber），分片执行</text>
  <text x="350" y="452" font-size="12" fill="#2563eb" font-weight="bold">↓ 时间切片</text>
  <text x="350" y="470" font-size="12" fill="#1e40af">每执行一小段就</text>
  <text x="350" y="488" font-size="12" fill="#1e40af">让出主线程，</text>

  <rect x="560" y="332" width="380" height="150" rx="10" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="580" y="358" font-size="13" fill="#334155" font-weight="bold">收益：</text>
  <text x="580" y="380" font-size="12.5" fill="#475569">· 渲染可被优先级更高的任务（输入、动画）打断</text>
  <text x="580" y="400" font-size="12.5" fill="#475569">· 中断后可恢复 / 丢弃过期结果（concurrent）</text>
  <text x="580" y="420" font-size="12.5" fill="#475569">· 浏览器有空闲时再接着算，主线程不再被长期占死</text>
  <text x="580" y="448" font-size="12.5" fill="#334155" font-weight="bold">fiber 还保存：双缓存树、副作用链表、优先级 lane</text>

  <text x="560" y="508" font-size="12" fill="#1e40af">本质：链表式的可中断工作单元，而非递归调用栈</text>
</svg>
