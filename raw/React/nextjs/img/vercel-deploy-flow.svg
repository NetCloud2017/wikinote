<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1160" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#8a94a6"/>
    </marker>
    <linearGradient id="hd" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#1f2937"/>
    </linearGradient>
  </defs>

  <!-- 标题 -->
  <text x="500" y="52" text-anchor="middle" font-size="26" font-weight="700" fill="#111827">Next.js（16）Vercel 部署全流程</text>
  <text x="500" y="80" text-anchor="middle" font-size="14" fill="#6b7280">v0.0 · 免费版 · 边缘网络 + 自动 CI/CD + HTTPS/自定义域名</text>
  <line x1="120" y1="100" x2="880" y2="100" stroke="#e5e7eb" stroke-width="2"/>

  <!-- ============ 阶段 1：准备 ============ -->
  <rect x="40" y="120" width="920" height="222" rx="14" fill="#eff6ff"/>
  <text x="70" y="152" font-size="16" font-weight="700" fill="#2563eb">① 准备：账号 · CLI · 关联项目</text>

  <g font-size="13" fill="#111827">
    <rect x="90" y="168" width="240" height="58" rx="10" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
    <text x="110" y="192" font-weight="700">1. 登录 vercel.com</text>
    <text x="110" y="212" fill="#6b7280">Google / GitHub 等任选登录</text>

    <rect x="380" y="168" width="240" height="58" rx="10" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
    <text x="400" y="192" font-weight="700">2. 全局安装 CLI</text>
    <text x="400" y="212" fill="#6b7280">npm i -g vercel（-g 全局）</text>

    <rect x="670" y="168" width="260" height="58" rx="10" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
    <text x="690" y="192" font-weight="700">3. vercel --version 验证</text>
    <text x="690" y="212" fill="#6b7280">输出版本即安装成功</text>
  </g>

  <!-- 关联分支 -->
  <line x1="210" y1="228" x2="210" y2="258" stroke="#8a94a6" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="500" y1="228" x2="500" y2="258" stroke="#8a94a6" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="800" y1="228" x2="800" y2="258" stroke="#8a94a6" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="210" y1="258" x2="800" y2="258" stroke="#8a94a6" stroke-width="1.5"/>

  <rect x="120" y="264" width="330" height="62" rx="10" fill="#dbeafe" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="140" y="288" font-size="13" font-weight="700" fill="#1e3a8a">方式 A：vercel link（本地直传）</text>
  <text x="140" y="310" font-size="12" fill="#3b5b9d">回答交互问题：项目/Scope/名称/根目录，识别为 Next.js</text>

  <rect x="500" y="264" width="350" height="62" rx="10" fill="#dbeafe" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="520" y="288" font-size="13" font-weight="700" fill="#1e3a8a">方式 B：GitHub 绑定 + Import</text>
  <text x="520" y="310" font-size="12" fill="#3b5b9d">平台绑定 Git 仓库，一键导入关联</text>

  <!-- ============ 阶段 2：数据库与配置 ============ -->
  <rect x="40" y="358" width="920" height="252" rx="14" fill="#fdf4ff"/>
  <text x="70" y="390" font-size="16" font-weight="700" fill="#9333ea">② 数据库：创建 · 连接 · 环境变量</text>

  <g font-size="13" fill="#111827">
    <rect x="90" y="404" width="260" height="62" rx="10" fill="#ffffff" stroke="#d8b4fe" stroke-width="1.5"/>
    <text x="110" y="428" font-weight="700">4. 创建数据库</text>
    <text x="110" y="450" fill="#6b7280">Storage → 选 PostgreSQL（Prisma 支持且免费）</text>

    <rect x="390" y="404" width="250" height="62" rx="10" fill="#ffffff" stroke="#d8b4fe" stroke-width="1.5"/>
    <text x="410" y="428" font-weight="700">5. 选区域 + free 套餐</text>
    <text x="410" y="450" fill="#6b7280">区域任选（如 USA），用免费档</text>

    <rect x="680" y="404" width="250" height="62" rx="10" fill="#ffffff" stroke="#d8b4fe" stroke-width="1.5"/>
    <text x="700" y="428" font-weight="700">6. 连接项目 + 生成连接串</text>
    <text x="700" y="450" fill="#6b7280">控制台 → Connect → 生成连接字符串</text>
  </g>

  <line x1="220" y1="468" x2="220" y2="498" stroke="#8a94a6" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="515" y1="468" x2="515" y2="498" stroke="#8a94a6" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="805" y1="468" x2="805" y2="498" stroke="#8a94a6" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="220" y1="498" x2="805" y2="498" stroke="#8a94a6" stroke-width="1.5"/>

  <rect x="150" y="504" width="700" height="88" rx="10" fill="#fae8ff" stroke="#c084fc" stroke-width="1.5"/>
  <text x="172" y="528" font-size="13" font-weight="700" fill="#6b21a8">7. 配置环境变量（两处 .env）</text>
  <text x="172" y="552" font-size="12" fill="#7c3aed">.env  → 给 Prisma 用（连接字符串，勿改动）</text>
  <text x="172" y="574" font-size="12" fill="#7c3aed">.env.local → 关联云端 Vercel，同步 better-auth URL（去掉末尾斜杠）</text>

  <!-- ============ 阶段 3：迁移与验证 ============ -->
  <rect x="40" y="626" width="920" height="170" rx="14" fill="#ecfdf5"/>
  <text x="70" y="658" font-size="16" font-weight="700" fill="#059669">③ 迁移：同步表结构 · 生成客户端</text>

  <g font-size="13" fill="#111827">
    <rect x="90" y="674" width="350" height="60" rx="10" fill="#ffffff" stroke="#6ee7b7" stroke-width="1.5"/>
    <text x="110" y="698" font-weight="700">8. npx prisma migrate dev --name init</text>
    <text x="110" y="720" fill="#6b7280">把表结构同步到线上库（可能超时，网络问题需重跑）</text>

    <rect x="500" y="674" width="350" height="60" rx="10" fill="#ffffff" stroke="#6ee7b7" stroke-width="1.5"/>
    <text x="520" y="698" font-weight="700">9. npx prisma generate</text>
    <text x="520" y="720" fill="#6b7280">重新生成 Prisma 客户端文件</text>
  </g>

  <line x1="440" y1="704" x2="498" y2="704" stroke="#8a94a6" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="150" y="748" width="700" height="36" rx="10" fill="#a7f3d0" stroke="#34d399" stroke-width="1.5"/>
  <text x="172" y="772" font-size="13" font-weight="700" fill="#065f46">10. 验证线上库：Vercel 控制台连接出现小绿标 + Studio 查看表</text>

  <!-- ============ 阶段 4：部署与测试 ============ -->
  <rect x="40" y="812" width="920" height="252" rx="14" fill="#fff7ed"/>
  <text x="70" y="844" font-size="16" font-weight="700" fill="#ea580c">④ 部署：上线 · 测试 · 收尾</text>

  <g font-size="13" fill="#111827">
    <rect x="90" y="858" width="280" height="60" rx="10" fill="#ffffff" stroke="#fdba74" stroke-width="1.5"/>
    <text x="110" y="882" font-weight="700">11. vercel --prod 部署</text>
    <text x="110" y="904" fill="#6b7280">生成预览/线上域名（也可用分配域名刷新）</text>

    <rect x="420" y="858" width="260" height="60" rx="10" fill="#ffffff" stroke="#fdba74" stroke-width="1.5"/>
    <text x="440" y="882" font-weight="700">12. 测试注册 / 登录</text>
    <text x="440" y="904" fill="#6b7280">访问 /home，接口与数据入库均正常</text>

    <rect x="730" y="858" width="200" height="60" rx="10" fill="#ffffff" stroke="#fdba74" stroke-width="1.5"/>
    <text x="750" y="882" font-weight="700">13.（可选）GitHub 登录</text>
    <text x="750" y="904" fill="#6b7280">改回调 URL 为线上域名</text>
  </g>

  <line x1="370" y1="888" x2="418" y2="888" stroke="#8a94a6" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="680" y1="888" x2="728" y2="888" stroke="#8a94a6" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- 结果条 -->
  <rect x="120" y="944" width="760" height="62" rx="12" fill="#111827"/>
  <text x="150" y="972" font-size="15" font-weight="700" fill="#ffffff">✅ 部署完成（免费）：提交代码即自动 CI/CD · 边缘网络就近访问 · HTTPS 与自定义域名</text>
  <text x="150" y="994" font-size="12" fill="#9ca3af">限制：免费版每月 100G 流量；对国内网络不友好，需代理访问</text>

  <text x="500" y="1040" text-anchor="middle" font-size="12" fill="#9ca3af">视频参考：B站「Next.js(16)+AI+SEO」P36 部署Vercel · 作者：小满zs</text>
</svg>
