<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 690" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" width="980" height="690">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="980" height="690" fill="#f8fafc"/>

  <!-- Title -->
  <text x="490" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">Next.js 配置文件：加载与导出流程（Next.js 16 基线）</text>
  <text x="490" y="56" text-anchor="middle" font-size="13" fill="#64748b">next.config.* —— 项目根目录、默认导出、Node 模块，dev/build/start 启动阶段执行</text>

  <!-- Layer 1: file formats -->
  <g>
    <text x="40" y="96" font-size="14" font-weight="700" fill="#334155">① 文件名（放项目根目录，与 package.json 同级）</text>
    <rect x="40" y="106" width="250" height="52" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <text x="165" y="128" text-anchor="middle" font-size="15" font-weight="700" fill="#1e40af">next.config.ts</text>
    <text x="165" y="148" text-anchor="middle" font-size="12" fill="#475569">推荐 · create-next-app 默认 · 类型安全</text>

    <rect x="310" y="106" width="250" height="52" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="435" y="128" text-anchor="middle" font-size="15" font-weight="700" fill="#334155">next.config.js</text>
    <text x="435" y="148" text-anchor="middle" font-size="12" fill="#64748b">CommonJS · module.exports</text>

    <rect x="580" y="106" width="250" height="52" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="705" y="128" text-anchor="middle" font-size="15" font-weight="700" fill="#334155">next.config.mjs</text>
    <text x="705" y="148" text-anchor="middle" font-size="12" fill="#64748b">ESM · export default</text>

    <rect x="850" y="106" width="110" height="52" rx="8" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="905" y="128" text-anchor="middle" font-size="12" fill="#b91c1c">.cjs / .cts</text>
    <text x="905" y="148" text-anchor="middle" font-size="12" fill="#b91c1c">不支持 ✗</text>
  </g>

  <line x1="490" y1="170" x2="490" y2="198" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Layer 2: node loading -->
  <g>
    <rect x="130" y="202" width="720" height="62" rx="8" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1.5"/>
    <text x="490" y="226" text-anchor="middle" font-size="15" font-weight="700" fill="#075985">② Node.js 加载（不是浏览器 bundle）</text>
    <text x="490" y="250" text-anchor="middle" font-size="12.5" fill="#475569">不被 webpack / Babel 解析 · 可读 process.env（.env 值按运行时优先级注入）· 别用浏览器 API 或超出版本的新语法</text>
  </g>

  <line x1="490" y1="278" x2="490" y2="306" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Layer 3: export modes -->
  <g>
    <text x="40" y="330" font-size="14" font-weight="700" fill="#334155">③ 导出方式（默认导出）</text>

    <rect x="40" y="340" width="430" height="88" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="255" y="364" text-anchor="middle" font-size="14" font-weight="700" fill="#5b21b6">对象导出（最简单）</text>
    <text x="255" y="388" text-anchor="middle" font-size="12.5" fill="#475569">export default { images: {...}, output: 'standalone' }</text>
    <text x="255" y="410" text-anchor="middle" font-size="12" fill="#64748b">适合全局固定配置</text>

    <rect x="500" y="340" width="440" height="88" rx="8" fill="#fdf4ff" stroke="#c026d3" stroke-width="1.5"/>
    <text x="720" y="364" text-anchor="middle" font-size="14" font-weight="700" fill="#a21caf">函数导出（按环境分支）</text>
    <text x="720" y="388" text-anchor="middle" font-size="12.5" fill="#475569">export default (phase, { defaultConfig }) => ({...})</text>
    <text x="720" y="410" text-anchor="middle" font-size="12" fill="#64748b">可 async（Next 12.1+）· 用 phase 区分 dev/build</text>
  </g>

  <line x1="490" y1="444" x2="490" y2="472" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Layer 4: phases -->
  <g>
    <text x="40" y="496" font-size="14" font-weight="700" fill="#334155">④ phase 阶段常量（来自 next/constants）决定加载哪组配置</text>

    <rect x="40" y="506" width="270" height="58" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="175" y="530" text-anchor="middle" font-size="13.5" font-weight="700" fill="#166534">PHASE_DEVELOPMENT_SERVER</text>
    <text x="175" y="552" text-anchor="middle" font-size="12.5" fill="#475569">→ next dev</text>

    <rect x="355" y="506" width="270" height="58" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="490" y="530" text-anchor="middle" font-size="13.5" font-weight="700" fill="#166534">PHASE_PRODUCTION_BUILD</text>
    <text x="490" y="552" text-anchor="middle" font-size="12.5" fill="#475569">→ next build</text>

    <rect x="670" y="506" width="270" height="58" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="805" y="530" text-anchor="middle" font-size="13.5" font-weight="700" fill="#166534">PHASE_PRODUCTION_SERVER</text>
    <text x="805" y="552" text-anchor="middle" font-size="12.5" fill="#475569">→ next start（另有 PHASE_TEST / PHASE_EXPORT）</text>
  </g>

  <line x1="490" y1="580" x2="490" y2="608" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Layer 5: option scope -->
  <g>
    <rect x="60" y="612" width="860" height="60" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
    <text x="490" y="634" text-anchor="middle" font-size="15" font-weight="700" fill="#92400e">⑤ 配置项在 dev / build 阶段被消费</text>
    <text x="490" y="658" text-anchor="middle" font-size="12.5" fill="#475569">打包 Turbopack/webpack · 图片 images · 路由/响应头 redirects·headers · 缓存 cacheComponents/cacheLife · 部署 output/basePath · 转译 transpilePackages · 类型 typedRoutes …</text>
  </g>
</svg>
