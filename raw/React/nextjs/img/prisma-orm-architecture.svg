<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 700" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" width="980" height="700">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-dash" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="980" height="700" fill="#f8fafc"/>

  <!-- Title -->
  <text x="490" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">使用 ORM：以 Prisma 为例</text>
  <text x="490" y="54" text-anchor="middle" font-size="13" fill="#64748b">Next.js 16 基线 · Prisma 7 稳定版 · 服务端代码经类型安全客户端访问数据库</text>

  <!-- Left section: runtime flow -->
  <text x="40" y="88" font-size="14" font-weight="700" fill="#334155">运行时数据流（服务端代码 → 数据库）</text>

  <!-- Row 1: three entry points -->
  <rect x="40" y="98" width="170" height="54" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="125" y="122" text-anchor="middle" font-size="14" font-weight="700" fill="#1e40af">Server Component</text>
  <text x="125" y="142" text-anchor="middle" font-size="11.5" fill="#475569">await prisma.post.findMany()</text>

  <rect x="225" y="98" width="170" height="54" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="310" y="122" text-anchor="middle" font-size="14" font-weight="700" fill="#1e40af">Route Handler</text>
  <text x="310" y="142" text-anchor="middle" font-size="11.5" fill="#475569">route.ts → GET / POST</text>

  <rect x="410" y="98" width="170" height="54" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="495" y="122" text-anchor="middle" font-size="14" font-weight="700" fill="#1e40af">Server Action</text>
  <text x="495" y="142" text-anchor="middle" font-size="11.5" fill="#475569">"use server" + revalidate</text>

  <line x1="310" y1="152" x2="310" y2="180" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Box 2: singleton -->
  <rect x="40" y="182" width="540" height="54" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="310" y="206" text-anchor="middle" font-size="14.5" font-weight="700" fill="#5b21b6">② 一个 PrismaClient 单例 —— lib/prisma.ts</text>
  <text x="310" y="226" text-anchor="middle" font-size="11.5" fill="#475569">globalForPrisma 全局复用 · 避免 serverless / 热更新连接耗尽</text>

  <line x1="310" y1="236" x2="310" y2="264" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Box 3: typed API -->
  <rect x="40" y="266" width="540" height="58" rx="8" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1.5"/>
  <text x="310" y="290" text-anchor="middle" font-size="14.5" font-weight="700" fill="#075985">③ 类型安全查询 API（生成代码）</text>
  <text x="310" y="312" text-anchor="middle" font-size="11.5" fill="#475569">findMany / create / update / upsert / delete / $transaction / aggregate</text>

  <line x1="310" y1="324" x2="310" y2="352" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Box 4: schema -->
  <rect x="40" y="354" width="540" height="58" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="310" y="378" text-anchor="middle" font-size="14.5" font-weight="700" fill="#166534">④ schema.prisma 模型（单一事实来源）</text>
  <text x="310" y="400" text-anchor="middle" font-size="11.5" fill="#475569">model User { id @id @default(auto increment) } · @relation · 枚举 · 索引</text>

  <line x1="310" y1="412" x2="310" y2="440" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Box 5: database -->
  <rect x="40" y="442" width="540" height="54" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="310" y="466" text-anchor="middle" font-size="14.5" font-weight="700" fill="#92400e">⑤ 数据库</text>
  <text x="310" y="486" text-anchor="middle" font-size="11.5" fill="#475569">PostgreSQL / MySQL / SQLite / MongoDB</text>

  <!-- Right section: CLI workflow -->
  <text x="640" y="88" font-size="14" font-weight="700" fill="#334155">开发 / 构建时 CLI 工作流</text>

  <rect x="640" y="98" width="300" height="48" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="790" y="120" text-anchor="middle" font-size="13.5" font-weight="700" fill="#334155">npx prisma init</text>
  <text x="790" y="138" text-anchor="middle" font-size="11" fill="#64748b">生成 schema.prisma + .env</text>

  <line x1="790" y1="146" x2="790" y2="168" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="640" y="170" width="300" height="48" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="790" y="192" text-anchor="middle" font-size="13.5" font-weight="700" fill="#334155">npx prisma migrate dev</text>
  <text x="790" y="210" text-anchor="middle" font-size="11" fill="#64748b">--name init · 建表并生成迁移</text>

  <line x1="790" y1="218" x2="790" y2="240" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="640" y="242" width="300" height="48" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="790" y="264" text-anchor="middle" font-size="13.5" font-weight="700" fill="#5b21b6">npx prisma generate</text>
  <text x="790" y="282" text-anchor="middle" font-size="11" fill="#64748b">按 schema 生成类型安全 Client</text>

  <line x1="790" y1="290" x2="790" y2="312" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="640" y="314" width="300" height="48" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="790" y="336" text-anchor="middle" font-size="13.5" font-weight="700" fill="#92400e">改动 schema 后重跑</text>
  <text x="790" y="354" text-anchor="middle" font-size="11" fill="#64748b">migrate dev + generate 双跑</text>

  <line x1="790" y1="362" x2="790" y2="384" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="640" y="386" width="300" height="48" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="790" y="408" text-anchor="middle" font-size="13.5" font-weight="700" fill="#334155">生产 / 部署：migrate deploy</text>
  <text x="790" y="426" text-anchor="middle" font-size="11" fill="#64748b">只应用已提交的迁移文件</text>

  <line x1="790" y1="434" x2="790" y2="456" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="640" y="458" width="300" height="48" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="790" y="480" text-anchor="middle" font-size="13.5" font-weight="700" fill="#065f46">npx prisma studio</text>
  <text x="790" y="498" text-anchor="middle" font-size="11" fill="#64748b">浏览器可视化查看 / 编辑数据</text>

  <!-- dashed: schema -> generate -->
  <line x1="580" y1="383" x2="636" y2="266" stroke="#7c3aed" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow-dash)"/>
  <text x="600" y="330" font-size="11" fill="#7c3aed" transform="rotate(-70 600 330)">generate 按 schema 生成 Client</text>

  <!-- Bottom strip -->
  <rect x="40" y="536" width="900" height="62" rx="8" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
  <text x="490" y="558" text-anchor="middle" font-size="14.5" font-weight="700" fill="#0f172a">核心心智：schema.prisma 是唯一事实来源</text>
  <text x="490" y="582" text-anchor="middle" font-size="12" fill="#475569">改模型 → migrate 同步表结构 + generate 重新生成客户端 → 服务端代码用同一客户端读写，全程类型安全</text>

  <!-- Legend for version note -->
  <text x="40" y="640" font-size="13" font-weight="700" fill="#334155">版本口径</text>
  <text x="40" y="662" font-size="12" fill="#475569">Prisma 7（@prisma/client 7.x）= 当前稳定、主流写法（schema.prisma）。Prisma 8（contract-first）截至 2026-10 仍为 RC，API 未定稿，本笔记不采用。</text>
</svg>
