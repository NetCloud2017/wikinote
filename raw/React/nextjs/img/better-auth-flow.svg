<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 780" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2f7"/>
    </linearGradient>
  </defs>

  <rect width="1080" height="780" fill="url(#bg)"/>

  <text x="540" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">Better-Auth 身份验证：文件分工 × 请求链路 × 两种登录</text>

  <!-- ========== 左列：两个配置文件分工 ========== -->
  <text x="240" y="78" text-anchor="middle" font-size="14" font-weight="600" fill="#475569">两个文件的分工</text>

  <!-- auth.ts 后端 -->
  <rect x="60" y="96" width="360" height="180" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="240" y="122" text-anchor="middle" font-size="15" font-weight="700" fill="#1e40af">src/lib/auth.ts（后端配置）</text>
  <text x="76" y="148" font-size="12" fill="#1e3a8a">• betterAuth({...}) 创建服务端实例</text>
  <text x="76" y="170" font-size="12" fill="#1e3a8a">• database: prismaAdapter(prisma, {provider})</text>
  <text x="76" y="192" font-size="12" fill="#1e3a8a">• emailAndPassword.enabled = true → 邮箱密码登录</text>
  <text x="76" y="214" font-size="12" fill="#1e3a8a">• socialProviders.github → 第三方登录</text>
  <text x="76" y="236" font-size="12" fill="#1e3a8a">• 需要 BETTER_AUTH_SECRET / URL 等环境变量</text>
  <text x="76" y="260" font-size="12" fill="#1e3a8a">• 内置 Session / Cookie / JWT / OAuth</text>

  <!-- auth-client.ts 前端 -->
  <rect x="60" y="296" width="360" height="140" rx="10" fill="#fce7f3" stroke="#ec4899" stroke-width="1.5"/>
  <text x="240" y="322" text-anchor="middle" font-size="15" font-weight="700" fill="#9d174d">src/lib/auth-client.ts（前端客户端）</text>
  <text x="76" y="348" font-size="12" fill="#831843">• createAuthClient({ baseURL })</text>
  <text x="76" y="370" font-size="12" fill="#831843">• 导出 signIn / signUp / useSession</text>
  <text x="76" y="392" font-size="12" fill="#831843">• 控制前端交互，可读 session</text>
  <text x="76" y="414" font-size="12" fill="#831843">• 只在前端组件中 import 使用</text>

  <!-- ========== 中列：请求链路 ========== -->
  <text x="540" y="78" text-anchor="middle" font-size="14" font-weight="600" fill="#475569">请求链路（App Router）</text>

  <rect x="420" y="96" width="240" height="64" rx="10" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5"/>
  <text x="540" y="124" text-anchor="middle" font-size="14" font-weight="700" fill="#166534">客户端组件</text>
  <text x="540" y="146" text-anchor="middle" font-size="12" fill="#14532d">home / user（"use client"）</text>

  <line x1="540" y1="160" x2="540" y2="188" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="420" y="192" width="240" height="64" rx="10" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="540" y="220" text-anchor="middle" font-size="14" font-weight="700" fill="#3730a3">app/api/auth/[...all]/route.ts</text>
  <text x="540" y="242" text-anchor="middle" font-size="12" fill="#312e81">toNextJsHandler(auth) → GET/POST</text>

  <line x1="540" y1="256" x2="540" y2="284" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="420" y="288" width="240" height="64" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="540" y="316" text-anchor="middle" font-size="14" font-weight="700" fill="#92400e">auth 实例</text>
  <text x="540" y="338" text-anchor="middle" font-size="12" fill="#78350f">自动处理 OAuth / Session / 校验</text>

  <line x1="540" y1="352" x2="540" y2="380" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="420" y="384" width="240" height="64" rx="10" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/>
  <text x="540" y="412" text-anchor="middle" font-size="14" font-weight="700" fill="#065f46">prismaAdapter</text>
  <text x="540" y="434" text-anchor="middle" font-size="12" fill="#064e3b">连接 PostgreSQL（DATABASE_URL）</text>

  <line x1="540" y1="448" x2="540" y2="476" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="420" y="480" width="240" height="64" rx="10" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="540" y="508" text-anchor="middle" font-size="14" font-weight="700" fill="#5b21b6">PostgreSQL（auth 库）</text>
  <text x="540" y="530" text-anchor="middle" font-size="12" fill="#4c1d95">user / session / account / verification</text>

  <!-- ========== 右列：两种登录 ========== -->
  <text x="850" y="78" text-anchor="middle" font-size="14" font-weight="600" fill="#475569">两种登录方式</text>

  <!-- 邮箱密码 -->
  <rect x="700" y="96" width="320" height="150" rx="10" fill="#fff7ed" stroke="#fb923c" stroke-width="1.5"/>
  <text x="860" y="122" text-anchor="middle" font-size="14" font-weight="700" fill="#9a3412">① 邮箱 + 密码登录</text>
  <text x="716" y="150" font-size="12" fill="#7c2d12">注册：signUp.email({ name, email, password })</text>
  <text x="716" y="172" font-size="12" fill="#7c2d12">登录：signIn.email({ email, password })</text>
  <text x="716" y="194" font-size="12" fill="#7c2d12">返回 { data, error }；错误密码 → 401</text>
  <text x="716" y="216" font-size="12" fill="#7c2d12">加 callbackURL: "/user" → 登录后跳转</text>
  <text x="716" y="238" font-size="12" fill="#7c2d12">读取用户：useSession() / auth.api.getSession</text>

  <!-- GitHub -->
  <rect x="700" y="266" width="320" height="150" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="860" y="292" text-anchor="middle" font-size="14" font-weight="700" fill="#3730a3">② GitHub 第三方登录（OAuth）</text>
  <text x="716" y="320" font-size="12" fill="#312e81">配置：socialProviders.github 填 clientId/Secret</text>
  <text x="716" y="342" font-size="12" fill="#312e81">登录：signIn.social({ provider: "github",</text>
  <text x="716" y="364" font-size="12" fill="#312e81">  callbackURL: "/user" })</text>
  <text x="716" y="386" font-size="12" fill="#312e81">→ 跳到 GitHub 授权 → 回调 → 写 session</text>
  <text x="716" y="408" font-size="12" fill="#312e81">谷歌 / 苹果同理，只换 clientId/Secret</text>

  <!-- ========== 底部：固定挂载路径提示 ========== -->
  <rect x="60" y="560" width="960" height="150" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="540" y="590" text-anchor="middle" font-size="14" font-weight="700" fill="#334155">关键约定与避坑</text>
  <text x="80" y="618" font-size="12" fill="#475569">• 挂载路径固定：app/api/auth/[...all]/route.ts，不可随意改（客户端自动向该位置发请求）</text>
  <text x="80" y="642" font-size="12" fill="#475569">• auth.ts 建议放 src/lib/auth.ts（官方默认读取位置，变动会有问题）</text>
  <text x="80" y="666" font-size="12" fill="#475569">• BETTER_AUTH_SECRET 用 openssl rand -base64 32 生成，不可过短/过于简单</text>
  <text x="80" y="690" font-size="12" fill="#475569">• 读 session 的页面要改成客户端组件（"use client"），防止被缓存、读到旧数据</text>
  <text x="80" y="714" font-size="12" fill="#475569">• 先跑 npx @better-auth/cli init 生成表 → 再 npx prisma migrate dev 同步 → 再 prisma generate</text>
  <text x="80" y="738" font-size="12" fill="#475569">• 未开启 emailAndPassword 时，邮箱密码登录不可用；两者要分清：auth.ts=后端，auth-client.ts=前端</text>

  <text x="540" y="766" text-anchor="middle" font-size="11" fill="#94a3b8">来源：小满zs《Next.js(16)+AI+SEO》p35 · better-auth 官方文档</text>
</svg>
