<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif">
  <title>SSG 动态路由处理决策流程</title>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arrowblue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrowred" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- 标题 -->
  <rect x="0" y="0" width="960" height="56" rx="0" fill="#1e3a8a"/>
  <text x="480" y="36" text-anchor="middle" fill="#ffffff" font-size="24" font-weight="700">SSG 动态路由处理决策流程</text>

  <!-- 起点：构建 -->
  <rect x="380" y="84" width="200" height="52" rx="10" fill="#eef2ff" stroke="#4338ca" stroke-width="2"/>
  <text x="480" y="110" text-anchor="middle" fill="#312e81" font-size="17" font-weight="700">next build 构建</text>
  <text x="480" y="130" text-anchor="middle" fill="#4338ca" font-size="13">开始预渲染</text>

  <!-- 判断：generateStaticParams -->
  <polygon points="480,200 250,168 480,136 710,168" fill="#e0e7ff" stroke="#4338ca" stroke-width="2"/>
  <text x="480" y="161" text-anchor="middle" fill="#1e293b" font-size="15" font-weight="700">generateStaticParams()</text>
  <text x="480" y="179" text-anchor="middle" fill="#1e293b" font-size="13">列出全部静态参数？</text>

  <!-- 是 -->
  <rect x="600" y="260" width="240" height="58" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="720" y="285" text-anchor="middle" fill="#14532d" font-size="16" font-weight="700">是 → 构建时预渲染</text>
  <text x="720" y="305" text-anchor="middle" fill="#166534" font-size="13">每个参数生成一份静态 HTML</text>

  <!-- 否 -->
  <rect x="120" y="260" width="240" height="58" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="240" y="285" text-anchor="middle" fill="#7c2d12" font-size="16" font-weight="700">否 → 参数运行时才知道</text>
  <text x="240" y="305" text-anchor="middle" fill="#9a3412" font-size="13">不预渲染，留给请求时处理</text>

  <!-- 箭头：起点→判断 -->
  <line x1="480" y1="136" x2="480" y2="136" stroke="#64748b" stroke-width="0"/>
  <line x1="480" y1="136" x2="560" y2="136" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="560" y1="136" x2="560" y2="168" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 是 分支箭头 -->
  <line x1="560" y1="168" x2="720" y2="168" stroke="#16a34a" stroke-width="2"/>
  <line x1="720" y1="168" x2="720" y2="260" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="730" y="208" fill="#16a34a" font-size="14" font-weight="700">是</text>

  <!-- 否 分支箭头 -->
  <line x1="400" y1="168" x2="240" y2="168" stroke="#ea580c" stroke-width="2"/>
  <line x1="240" y1="168" x2="240" y2="260" stroke="#ea580c" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="350" y="208" fill="#ea580c" font-size="14" font-weight="700">否</text>

  <!-- 产物符号说明区 -->
  <rect x="560" y="344" width="360" height="120" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="580" y="372" fill="#0f172a" font-size="15" font-weight="700">构建产物符号（build 输出）</text>
  <text x="580" y="398" fill="#334155" font-size="14">○　静态预渲染整条路由</text>
  <text x="580" y="420" fill="#334155" font-size="14">●　SSG：generateStaticParams 列出路径</text>
  <text x="580" y="442" fill="#334155" font-size="14">ƒ　Dynamic：按请求时渲染</text>

  <!-- 动态参数被请求时 -->
  <rect x="120" y="344" width="360" height="58" rx="10" fill="#f0f9ff" stroke="#0284c7" stroke-width="2"/>
  <text x="300" y="368" text-anchor="middle" fill="#0c4a6e" font-size="15" font-weight="700">未被列出的参数被请求时</text>
  <text x="300" y="388" text-anchor="middle" fill="#075985" font-size="13">看 dynamicParams 配置 →</text>

  <!-- dynamicParams 判断 -->
  <polygon points="300,452 80,470 300,488 520,470" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="300" y="474" text-anchor="middle" fill="#0c4a6e" font-size="14" font-weight="700">dynamicParams 取值</text>

  <!-- 箭头 动态参数→判断 -->
  <line x1="300" y1="402" x2="300" y2="452" stroke="#0284c7" stroke-width="2" marker-end="url(#arrowblue)"/>

  <!-- true 分支 -->
  <rect x="60" y="520" width="300" height="70" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="210" y="548" text-anchor="middle" fill="#14532d" font-size="15" font-weight="700">true（默认）</text>
  <text x="210" y="572" text-anchor="middle" fill="#166534" font-size="13">请求时按需动态渲染（ƒ）</text>
  <text x="210" y="588" text-anchor="middle" fill="#166534" font-size="12">≈ 旧版 fallback，SSG+动态兜底</text>

  <!-- false 分支 -->
  <rect x="600" y="520" width="300" height="70" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="750" y="548" text-anchor="middle" fill="#7f1d1d" font-size="15" font-weight="700">false</text>
  <text x="750" y="572" text-anchor="middle" fill="#991b1b" font-size="13">未列出的参数 → 返回 404</text>
  <text x="750" y="588" text-anchor="middle" fill="#991b1b" font-size="12">严格限定：只有列出的才可访问</text>

  <!-- 箭头 -->
  <line x1="170" y1="488" x2="150" y2="520" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="190" y="506" fill="#16a34a" font-size="13" font-weight="700">true</text>
  <line x1="430" y1="488" x2="750" y2="520" stroke="#dc2626" stroke-width="2" marker-end="url(#arrowred)"/>
  <text x="600" y="506" fill="#dc2626" font-size="13" font-weight="700">false</text>

  <!-- catch-all 提示 -->
  <rect x="360" y="344" width="180" height="120" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="450" y="372" text-anchor="middle" fill="#4c1d95" font-size="14" font-weight="700">动态段写法</text>
  <text x="450" y="396" text-anchor="middle" fill="#6d28d9" font-size="13">[slug]</text>
  <text x="450" y="416" text-anchor="middle" fill="#6d28d9" font-size="13">[...slug] catch-all</text>
  <text x="450" y="436" text-anchor="middle" fill="#6d28d9" font-size="13">[[...slug]] 可选</text>
  <text x="450" y="456" text-anchor="middle" fill="#6d28d9" font-size="12">generateStaticParams 返回</text>

  <!-- 图例 -->
  <text x="20" y="628" fill="#94a3b8" font-size="12">示意图（Next.js 16 / App Router）：决定一个动态路由是「全 SSG」「SSG+动态兜底」还是「严格 404」</text>
</svg>
