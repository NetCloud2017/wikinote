<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif">
  <title>SSG 场景下 next/image 图片优化时机</title>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="56" rx="0" fill="#0f172a"/>
  <text x="480" y="36" text-anchor="middle" fill="#ffffff" font-size="24" font-weight="700">SSG 场景下 next/image 图片优化时机</text>

  <!-- 起点 -->
  <rect x="360" y="80" width="240" height="48" rx="10" fill="#eef2ff" stroke="#4338ca" stroke-width="2"/>
  <text x="480" y="108" text-anchor="middle" fill="#312e81" font-size="16" font-weight="700">SSG 页面里的图片</text>

  <!-- 三种来源 -->
  <line x1="480" y1="128" x2="480" y2="160" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="140" y="160" width="260" height="52" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="270" y="185" text-anchor="middle" fill="#14532d" font-size="14" font-weight="700">静态 import</text>
  <text x="270" y="203" text-anchor="middle" fill="#166534" font-size="12">import img from './a.png'</text>

  <rect x="460" y="160" width="260" height="52" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="590" y="185" text-anchor="middle" fill="#1e3a8a" font-size="14" font-weight="700">远程 URL</text>
  <text x="590" y="203" text-anchor="middle" fill="#1d4ed8" font-size="12">src="https://cdn.xx.com/a.png"</text>

  <rect x="770" y="160" width="170" height="52" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="855" y="185" text-anchor="middle" fill="#4c1d95" font-size="14" font-weight="700">本地 /public</text>
  <text x="855" y="203" text-anchor="middle" fill="#6d28d9" font-size="12">src="/logo.png"</text>

  <!-- 各分支结果 -->
  <rect x="140" y="250" width="260" height="76" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="270" y="276" text-anchor="middle" fill="#14532d" font-size="14" font-weight="700">构建时（next build）优化</text>
  <text x="270" y="296" text-anchor="middle" fill="#166534" font-size="12">自动拿宽高 + 生成 blurDataURL</text>
  <text x="270" y="312" text-anchor="middle" fill="#166534" font-size="12">SSG 最契合，随 HTML 一并产出</text>

  <rect x="460" y="250" width="260" height="76" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="590" y="276" text-anchor="middle" fill="#1e3a8a" font-size="14" font-weight="700">运行时 /next/image 优化</text>
  <text x="590" y="296" text-anchor="middle" fill="#1d4ed8" font-size="12">请求时才缩放/转格式</text>
  <text x="590" y="312" text-anchor="middle" fill="#1d4ed8" font-size="12">需配 remotePatterns 白名单</text>

  <rect x="770" y="250" width="170" height="76" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="855" y="276" text-anchor="middle" fill="#4c1d95" font-size="14" font-weight="700">依赖运行时优化</text>
  <text x="855" y="296" text-anchor="middle" fill="#6d28d9" font-size="12">public 下文件走优化 API</text>
  <text x="855" y="312" text-anchor="middle" fill="#6d28d9" font-size="12">（非静态托管时）</text>

  <line x1="270" y1="212" x2="270" y2="250" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="590" y1="212" x2="590" y2="250" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="855" y1="212" x2="855" y2="250" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 关键坑：静态导出 -->
  <rect x="140" y="370" width="680" height="120" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="480" y="398" text-anchor="middle" fill="#7c2d12" font-size="16" font-weight="700">⚠ 纯静态导出 output: 'export' 时：默认优化器不可用</text>
  <text x="480" y="424" text-anchor="middle" fill="#9a3412" font-size="14">没有 Node 服务端跑 /next/image，远程/本地图无法运行时优化</text>
  <text x="480" y="450" text-anchor="middle" fill="#9a3412" font-size="14">三选一：① 配自定义 loader（如 Cloudinary / Imgix）② 静态 import 走构建时 ③ 直接 unoptimized</text>
  <text x="480" y="474" text-anchor="middle" fill="#431407" font-size="13" font-weight="700">结论：SSG 优先用静态 import，让图片随构建一起优化，别依赖运行时优化 API</text>

  <text x="20" y="548" fill="#94a3b8" font-size="12">示意图（Next.js 16）：图片优化发生在「构建时」还是「运行时」，决定了纯静态托管下图片能否被优化</text>
</svg>
